# wdf-method Framework Constitution
# Version: 3.9.0
#
# This constitution defines the non-negotiable rules for the wdf-method
# framework itself. CI enforces these rules on every PR.
#
# For project-level constitutions (generated by `wdf init`), see
# examples/*/constitution.yaml.

version: "3.9.0"

rules:
  # ── Code Quality ───────────────────────────────────────
  - id: WDF-001
    name: TypeScript strict mode
    description: All orchestrator source files must pass tsc --noEmit
    level: warning  # Pre-existing errors tolerated until cleanup pass
    scope: orchestrator/src/**/*.ts

  - id: WDF-002
    name: No stale dispatch permissions
    description: >
      .claude/settings.local.json must not contain wdf-dispatch entries.
      Every dispatch must be paired with a revoke. Stale entries indicate
      the permission lifecycle is not being followed.
    level: error
    check: "grep -c 'wdf-dispatch' .claude/settings.local.json || echo 0"
    expected: 0

  - id: WDF-003
    name: No scratch directories leaked
    description: >
      No wdf-*-test-* or wdf-*-scratch-* directories should exist outside
      of node_modules. These are temporary workspaces that must be cleaned
      up after each story completes.
    level: error
    check: "find . -maxdepth 3 -type d -name 'wdf-*-test-*' -o -name 'wdf-*-scratch-*' -not -path '*/node_modules/*' | wc -l"
    expected: 0

  # ── Agent Ecosystem ────────────────────────────────────
  - id: WDF-004
    name: Agent frontmatter required
    description: >
      Every file in references/agents/*.md must have valid YAML frontmatter
      with at least: name, description, default_permissions.
    level: error
    scope: references/agents/*.md

  - id: WDF-005
    name: Agent permissions must include bash_deny
    description: >
      Every agent's default_permissions must include bash_deny with at
      minimum: git push, rm -rf. This is the safety floor.
    level: error
    scope: references/agents/*.md

  # ── Test Coverage ──────────────────────────────────────
  - id: WDF-006
    name: Backend tests must be green
    description: All todo-app backend tests must pass in CI
    level: error
    scope: examples/todo-app/backend

  - id: WDF-007
    name: Frontend tests must be green
    description: All todo-app frontend tests must pass in CI
    level: error
    scope: examples/todo-app/frontend

  # ── Specification Consistency ──────────────────────────
  - id: WDF-008
    name: Delta spec format
    description: >
      All spec files under specs/ must use the three-section format:
      ADDED, MODIFIED, REMOVED.
    level: warning
    scope: specs/**/*.md

  - id: WDF-009
    name: Traceability references
    description: >
      Stories must reference REQ IDs that exist in the PRD or specs.
    level: warning
    scope: _wdf_output/stories/*.md

  # ── Security ───────────────────────────────────────────
  - id: WDF-010
    name: No secrets in source
    description: >
      No hard-coded provider credentials in tracked source. Matches known
      secret value formats (Stripe sk_live_/sk_test_, GitHub gh[posu]_, AWS
      AKIA, Slack xox*, Google AIza, PEM private keys) rather than the words
      "key"/"token"/"secret" — so env-var names and identifiers like
      `design_tokens` or `API_KEY = process.env.X` are not false positives.
    level: error
    check: 'git ls-files | grep -vE "node_modules" | xargs grep -lE "(sk_live_[A-Za-z0-9]{16,}|sk_test_[A-Za-z0-9]{16,}|gh[posu]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" 2>/dev/null | wc -l'
    expected: 0
