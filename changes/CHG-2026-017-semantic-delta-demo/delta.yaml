change_id: CHG-2026-017
summary: "Demo semantic delta v2 — add Password Reset requirement (with structural fields)"

base_version: "3.9.0"
target_version: "3.9.1"
schema_version: 2

operations:
  - op: ADDED
    domain: auth
    requirement:
      id: REQ-014
      name: Password Reset
      priority: P1
      description: A user who forgot their password can reset it via a time-limited token.
      scenarios:
        - name: Reset link issuance
          given:
            - a user who has forgotten their password
          when:
            - they request a reset link
          then:
            - the system MUST email a time-limited reset token to the registered address

        - name: Successful reset
          given:
            - a user holding an unexpired reset token
          when:
            - they submit a new password of length >= 12
          then:
            - the system MUST invalidate the token
            - the system MUST update the password hash

        - name: Expired token rejected
          given:
            - a user holding an expired reset token
          when:
            - they submit a new password
          then:
            - the system MUST reject the request with message "token expired"

      # CHG-2026-015 S3 — structural fields exercising the api/db cascade.
      endpoints:
        - method: POST
          path: /auth/password-reset
          operationId: requestPasswordReset
          request: PasswordResetRequestInput
          response: 202 Ack
        - method: POST
          path: /auth/password-reset/confirm
          operationId: confirmPasswordReset
          request: PasswordResetConfirmInput
          response: 200 Ack

      entities:
        - name: PasswordResetToken
          fields:
            - { name: token, type: TEXT, constraints: [pk] }
            - { name: user_id, type: UUID, constraints: [not_null, fk(User.id)] }
            - { name: expires_at, type: TIMESTAMP, constraints: [not_null] }

    rationale: "Reference v2 delta proving schema_version: 2 + structural fields (S3) end-to-end."
