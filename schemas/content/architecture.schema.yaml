schema: architecture-v1
artifact_type: architecture
description: "System architecture document covering C4 levels 1-3"
phase: 3

required_sections:
  system_context:
    description: "C4 Level 1 — system boundary, actors, external integrations"
    min_chars: 300
  containers:
    description: "C4 Level 2 — runtime containers (web app, API server, database, etc.)"
    min_items: 2
    item_format: "### {Container Name}\n- **Type**: ...\n- **Technology**: ...\n- **Responsibilities**: ..."
  components:
    description: "C4 Level 3 — key components within each container"
    min_items: 3
  decisions:
    description: "Architecture Decision Records (ADR) for key choices"
    min_items: 2
    item_format: "### ADR-{NNN}: {Title}\n- **Context**: ...\n- **Decision**: ...\n- **Consequences**: ..."
  deployment:
    description: "How and where the system is deployed"
    min_chars: 200

optional_sections:
  - quality_attributes
  - risk_register
  - cross_cutting_concerns
  - data_flow_diagrams
