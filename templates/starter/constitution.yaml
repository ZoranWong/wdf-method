# <PROJECT_NAME> Constitution
#
# Project-level non-negotiable rules. CI gates apply these via
# `wdf lint --only CONSTITUTION_CHECK`. Rules with `check:` + `expected:`
# are executed as shell snippets from the project root.
#
# This file is generated by `wdf init` based on the project type, then
# extended as the project matures. Mirror the framework-level
# `wdf-method/constitution.yaml` for the rule shape.

version: "0.1.0"

rules:
  # ── Code Quality ───────────────────────────────────────
  - id: PROJ-001
    name: TypeScript strict mode
    description: All source files must pass tsc --noEmit
    level: error
    scope: "{backend,frontend}/src/**/*.ts"

  - id: PROJ-002
    name: No stale dispatch permissions
    description: >
      .claude/settings.local.json must not contain wdf-dispatch entries
      outside of an active dispatch cycle.
    level: error
    check: "grep -c 'wdf-dispatch' .claude/settings.local.json 2>/dev/null || echo 0"
    expected: 0

  # ── Test Coverage ──────────────────────────────────────
  - id: PROJ-003
    name: Backend test coverage minimum
    description: Backend test coverage must meet the configured minimum (default 80%)
    level: error
    scope: backend/test/**

  - id: PROJ-004
    name: Frontend test coverage minimum
    description: Frontend test coverage must meet the configured minimum (default 80%)
    level: error
    scope: frontend/test/**

  # ── Security ───────────────────────────────────────────
  - id: PROJ-005
    name: No secrets in source
    description: >
      No .env files (other than .env.example), credentials, API keys,
      or tokens in tracked files.
    level: error
    check: "git ls-files 2>/dev/null | xargs grep -lE '(API_KEY|SECRET|PASSWORD|TOKEN)=' 2>/dev/null | grep -v '.env.example' | wc -l"
    expected: 0
