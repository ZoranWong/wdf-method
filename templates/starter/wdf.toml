# WDF project configuration — starter template
#
# Copy this file to your project root and fill in the placeholders.
# Generated by `wdf init` if you go the wizard route instead.

project_name = "<PROJECT_NAME>"
description = "<PROJECT_DESCRIPTION>"
version = "0.1.0"

# Dev mode: how Phase 4 work is split between tracks.
#   separated  — backend + frontend as independent tracks (default)
#   full_stack — single track, one agent does both
dev_mode = "separated"

# Triage mode: how Phase 4 stories are scheduled.
#   light    — no parallelism
#   serial   — strict FIFO
#   parallel — BE and FE tracks run in parallel (default)
#   auto     — pick based on story count
task_triage_mode = "parallel"

# Pipeline retry budget. Outer = review/testing/qa retries; inner =
# acceptance-check fix retries within a stage.
[pipeline]
max_pipeline_retries = 5
inner_fix_retries = 2
escalation_hold_hours = 24
auto_fail_on_hold_timeout = true

# Track definitions. Each track declares its stack and entry points.
[backend]
language = "typescript"
framework = "express"
validation = "zod"
database = "postgres"
orm = "drizzle"
api_style = "rest"

[frontend]
language = "typescript"
framework = "react"
build_tool = "vite"
styling = "tailwind"
state = "zustand"
