# CHG-2026-015 S4 — Minimal OpenAPI skeleton for brownfield-demo.
#
# This file represents the "before" state: an existing project has an
# api-spec.yaml but no specs/. Running `wdf init --from-existing` on this
# directory should parse this file and bootstrap _wdf_output/specs/.
openapi: 3.0.3
info:
  title: brownfield-demo API
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /auth/register:
    post:
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/login:
    post:
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /todos:
    get:
      operationId: listTodos
      responses:
        '200':
          description: List of todos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
    post:
      operationId: createTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
  /todos/{id}:
    delete:
      operationId: deleteTodo
      responses:
        '204':
          description: Deleted
components:
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        created_at:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Todo:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        completed:
          type: boolean
        owner_id:
          type: string
          format: uuid
    TodoInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
