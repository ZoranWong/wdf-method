code: wdf
name: "Web Dev Flow"
description: "Full-lifecycle web development automation: PRD through parallel BE/FE implementation with FSM-gated quality"
default_selected: false

# Variables from Core Config inserted:
## user_name
## project_name
## communication_language
## document_output_language
## output_folder

user_skill_level:
  prompt:
    - "What is your development experience level?"
    - "This affects how explanations are given."
  scope: user
  default: "intermediate"
  result: "{value}"
  single-select:
    - value: "beginner"
      label: "Beginner - Explain things clearly"
    - value: "intermediate"
      label: "Intermediate - Balance detail with speed"
    - value: "expert"
      label: "Expert - Be direct and technical"

output_folder:
  prompt: "Where should web-dev-flow output artifacts be stored?"
  default: "_bmad-output"
  result: "{project-root}/{value}"

output_dir:
  prompt: "Where should web-dev-flow status and state files be stored?"
  default: "{output_folder}/web-dev-flow"
  result: "{project-root}/{value}"

dev_mode:
  prompt: "What is your project architecture style?"
  default: "separated"
  result: "{value}"
  single-select:
    - value: "separated"
      label: "Separated — Frontend and backend are separate projects (React + Express, Vue + Nest)"
    - value: "full_stack"
      label: "Full-stack — Single unified codebase (Next.js, Nuxt, Remix)"

default_frontend_framework:
  prompt: "Preferred frontend framework?"
  default: "react"
  result: "{value}"
  single-select:
    - value: "react"
      label: "React + Vite"
    - value: "vue"
      label: "Vue + Vite"
    - value: "svelte"
      label: "Svelte + Vite"
    - value: "next"
      label: "Next.js (full-stack)"

default_backend_framework:
  prompt: "Preferred backend framework?"
  default: "express"
  result: "{value}"
  single-select:
    - value: "express"
      label: "Express.js"
    - value: "nest"
      label: "NestJS"
    - value: "fastify"
      label: "Fastify"
    - value: "none"
      label: "None (frontend-only project)"

# Directories to create during installation
directories:
  - "{output_dir}"
  - "{output_dir}/_output/planning"
  - "{output_dir}/_output/solutioning"
  - "{output_dir}/_output/acceptance"
  - "{output_dir}/status"
  - "{output_dir}/status/merge-queue/items"
  - "{output_dir}/status/stories"
